name: Deploy API (Cloud Run)

# Deploys the FastAPI backend (apps/api) to the dev Cloud Run service.
#
# The service is IAM-private: the browser never calls it. Next forwards /v1/*
# to it server-to-server with a Google ID token (src/app/v1/[...path]/route.ts),
# which is what lets the whole stack run on raw *.run.app hostnames with no
# custom domain. See issue #241.
#
# Schema migrations are deliberately NOT run here — deploy-dev.yml owns
# `prisma migrate deploy` for the shared database. Keeping a single migration
# owner avoids two workflows racing to apply the same migration on one push.

on:
  push:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - 'prisma/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      # Reuse the existing dev secrets (same project/region/auth).
      PROJECT_ID: ${{ secrets.DEV_GCP_PROJECT }}
      REGION: ${{ secrets.DEV_GCP_REGION }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.DEV_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOYER_SA: ${{ secrets.DEV_GCP_DEPLOYER_SA }}
      INSTANCE_CONNECTION_NAME: ${{ secrets.DEV_INSTANCE_CONNECTION_NAME }}
      # Defaults match infra/envs/dev/terraform.tfvars, so no new repo secrets
      # are required; override via secrets if the names ever diverge.
      CLOUD_RUN_SERVICE: ${{ secrets.DEV_API_CLOUD_RUN_SERVICE || 'family-recipe-api-dev' }}
      ARTIFACT_REGISTRY_REPO_ID: ${{ secrets.DEV_API_ARTIFACT_REGISTRY_REPO_ID || 'family-recipe-api-dev' }}
      # Same runtime SA as the Next service and the importer.
      RUNTIME_SERVICE_ACCOUNT: family-recipe-runner@family-recipe-dev.iam.gserviceaccount.com
      DATABASE_URL_SECRET: family-recipe-dev-database-url
      JWT_SECRET_NAME: family-recipe-dev-jwt-secret
      FAMILY_MASTER_KEY_SECRET_NAME: family-recipe-dev-family-master-key
      REFRESH_PEPPER_SECRET_NAME: family-recipe-dev-refresh-pepper
      UPLOADS_BUCKET: family-recipe-dev-uploads
      # Dev serves over HTTPS, so it runs with production cookie/validation
      # semantics (apps/api/src/settings.py::validate_settings).
      API_ENVIRONMENT: production
      # Empty by design: the browser reaches FastAPI only through the Next
      # origin, so no CORS middleware is installed.
      CORS_ALLOW_ORIGINS: ''
      # Trusted proxy hops for X-Forwarded-For resolution (issue #246). Deployed
      # topology is browser → GFE(Next) → Next proxy → GFE(FastAPI), so the two
      # Google front-ends append the trailing two XFF entries and the real
      # client sits at parts[-2]. Confirm against the #241 dev E2E pass; adjust
      # here without a code change if the observed chain differs.
      TRUSTED_PROXY_HOPS: '2'
      RECIPE_IMPORTER_URL: https://recipe-importer-dev-894181878182.us-east1.run.app
      RECIPE_IMPORTER_AUDIENCE: https://recipe-importer-dev-894181878182.us-east1.run.app
      RECIPE_IMPORTER_SERVICE_ACCOUNT_EMAIL: family-recipe-runner@family-recipe-dev.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Capture currently-serving revision (for rollback)
        run: |
          PREV_REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
          if [ -n "$PREV_REVISION" ]; then
            echo "Previously-serving revision: $PREV_REVISION"
          else
            echo "No previously-serving revision found (first deploy or service missing); rollback will be skipped."
          fi
          echo "PREV_REVISION=$PREV_REVISION" >> "$GITHUB_ENV"

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO_ID}/api:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" -f apps/api/Dockerfile .

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run (dev) at 0% traffic with candidate tag
        id: deploy
        run: |
          # Mirrors the canary pattern in deploy-dev.yml: build the revision
          # without traffic, probe it via its candidate tag, promote only when
          # the probe passes.
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --platform managed \
            --port 8000 \
            --quiet \
            --no-traffic \
            --tag candidate \
            --add-cloudsql-instances "$INSTANCE_CONNECTION_NAME" \
            --set-secrets DATABASE_URL=${DATABASE_URL_SECRET}:latest,JWT_SECRET=${JWT_SECRET_NAME}:latest,FAMILY_MASTER_KEY=${FAMILY_MASTER_KEY_SECRET_NAME}:latest,REFRESH_PEPPER=${REFRESH_PEPPER_SECRET_NAME}:latest \
            --set-env-vars ENVIRONMENT=${API_ENVIRONMENT},UPLOADS_BUCKET=${UPLOADS_BUCKET},CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS},TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS},RECIPE_IMPORTER_URL=${RECIPE_IMPORTER_URL},RECIPE_IMPORTER_AUDIENCE=${RECIPE_IMPORTER_AUDIENCE},RECIPE_IMPORTER_SERVICE_ACCOUNT_EMAIL=${RECIPE_IMPORTER_SERVICE_ACCOUNT_EMAIL} \
            --ingress all \
            --no-allow-unauthenticated

      - name: Resolve candidate + service URLs
        run: |
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          CANDIDATE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.traffic.filter("tag:candidate").extract(url).flatten())')"
          if [ -z "$CANDIDATE_URL" ]; then
            echo "Could not resolve candidate tag URL — failing fast." >&2
            exit 1
          fi
          echo "Service URL:    $SERVICE_URL"
          echo "Candidate URL:  $CANDIDATE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "CANDIDATE_URL=$CANDIDATE_URL" >> "$GITHUB_ENV"

      - name: Smoke check /health (against candidate revision)
        id: smoke_check
        run: |
          # The audience must be the SERVICE url, not the candidate url: Cloud
          # Run validates the `aud` claim against the service hostname, not
          # per-tag hostnames. Same rationale as deploy-dev.yml.
          # --impersonate-service-account routes the mint through
          # iamcredentials.generateIdToken, which WIF access tokens require.
          TOKEN="$(gcloud auth print-identity-token \
            --impersonate-service-account="$DEPLOYER_SA" \
            --audiences="$SERVICE_URL")"
          for i in {1..20}; do
            STATUS="$(curl -sS -H "Authorization: Bearer $TOKEN" -o /dev/null -w '%{http_code}' "$CANDIDATE_URL/v1/health" || true)"
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck OK (200)"
              exit 0
            fi
            echo "Healthcheck not ready yet (status=$STATUS), retrying..."
            sleep 3
          done
          echo "Healthcheck did not return 200 within timeout."
          exit 1

      - name: Promote candidate to LATEST
        if: steps.smoke_check.conclusion == 'success'
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-latest \
            --remove-tags=candidate \
            --quiet

      - name: Rollback traffic on smoke-check failure
        if: failure() && steps.smoke_check.conclusion == 'failure'
        run: |
          # --no-traffic means the failed revision never served; pin explicitly
          # to defend against any mid-flight traffic state.
          if [ -n "${PREV_REVISION:-}" ]; then
            echo "Smoke check failed. Pinning traffic to previous revision: $PREV_REVISION"
            gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --to-revisions="$PREV_REVISION=100" \
              --quiet
          else
            echo "No previous revision captured (first deploy?); skipping traffic pin."
          fi
          echo "Rollback complete. Job will fail so the broken deploy is surfaced."
          exit 1

      - name: Always remove candidate tag
        # Idempotent cleanup so a mid-pipeline failure can't leave the tag
        # attached and break the next run's URL resolution. See deploy-dev.yml.
        if: always() && steps.deploy.conclusion == 'success'
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --remove-tags=candidate \
            --quiet || true
